name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Agent Skills validator
        run: python -m pip install --disable-pip-version-check "skills-ref==0.1.1"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Validate Agent Skill
        run: agentskills validate skills/tweetapi
